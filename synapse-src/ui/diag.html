<!DOCTYPE html>
<html>
<head><title>Synapse Diagnostics</title></head>
<body style="font-family:monospace;background:#111;color:#eee;padding:2rem">
<h2>Synapse GPU Diagnostics</h2>
<pre id="log">Loading...</pre>
<script type="module">
import { ShardLoader } from "/node/shard-loader.js?v=diag2";
import { Pipeline } from "/node/pipeline.js?v=diag2";

const log = document.getElementById("log");
let allOutput = "";
const print = (s) => { log.textContent += s + "\n"; allOutput += s + "\n"; console.log(s); };
log.textContent = "";

async function postResults() {
  try {
    await fetch("/api/diag", { method: "POST", headers: {"Content-Type":"text/plain"}, body: allOutput });
  } catch {}
}

async function readBuffer(device, buf, size) {
  const staging = device.createBuffer({ size, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const enc = device.createCommandEncoder();
  enc.copyBufferToBuffer(buf, 0, staging, 0, size);
  device.queue.submit([enc.finish()]);
  await staging.mapAsync(GPUMapMode.READ);
  const data = new Float32Array(staging.getMappedRange().slice(0));
  staging.unmap();
  staging.destroy();
  return data;
}

async function run() {
  const adapter = await navigator.gpu?.requestAdapter();
  if (!adapter) { print("ERROR: No WebGPU adapter"); await postResults(); return; }
  const device = await adapter.requestDevice({
    requiredLimits: { maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize, maxBufferSize: adapter.limits.maxBufferSize }
  });
  print("WebGPU OK: " + (adapter.info?.description || adapter.info?.device || "unknown"));

  const loader = new ShardLoader(device);
  await loader.loadManifest(location.origin);
  const config = loader.getModelConfig();
  print(`Model: ${config.model}, layers: ${config.numLayers}, hidden: ${config.hiddenSize}`);

  // Determine which shard to load based on manifest
  const numShards = config.numShards;
  const shardFile = numShards === 1 ? "combined.bin" : "shard_0.bin";
  print(`Loading shard (${shardFile})...`);

  try {
    await loader.loadShard(0, `/shards/${shardFile}`, "/shards/shared.bin");
  } catch(e) {
    print("Shard load error: " + e.message);
    // Try alternative shard file
    try {
      await loader.loadShard(0, "/shards/shard_0.bin", "/shards/shared.bin");
    } catch(e2) {
      print("Both shard loads failed: " + e2.message);
      await postResults();
      return;
    }
  }
  print("Shard loaded!");

  const pipeline = new Pipeline(device, loader);
  await pipeline.init();
  print("Pipeline initialized");

  // Token IDs for "Hello Hello Synapse!"
  const tokenIds = [15496, 18435, 16065, 7512, 0];
  print(`Tokens: [${tokenIds}]`);

  // Embed
  let hidden = await pipeline.embed(tokenIds);
  let d = await readBuffer(device, hidden.buffer, 20);
  print(`Embed: [${Array.from(d.slice(0,5)).map(v=>v.toFixed(4))}]`);
  print(`Expected: [-0.0875, -0.3301, 0.0152, -0.1353, -0.1204]`);

  // Run all layers
  const numLayers = loader.manifest.shard_layout["0"].layer_end - loader.manifest.shard_layout["0"].layer_start + 1;
  for (let l = loader.manifest.shard_layout["0"].layer_start; l <= loader.manifest.shard_layout["0"].layer_end; l++) {
    hidden = await pipeline.forwardLayer(hidden, l);
    d = await readBuffer(device, hidden.buffer, 20);
    const hasNaN = Array.from(d).some(v => isNaN(v));
    print(`Layer ${l}: [${Array.from(d.slice(0,5)).map(v=>v.toFixed(2))}] NaN=${hasNaN}`);
    if (hasNaN) { print("NaN detected — stopping"); break; }
  }

  // Output head (only if we have all 12 layers)
  if (numLayers === 12) {
    const logitsTensor = await pipeline.outputHead(hidden);
    const vocabSize = config.vocabSize;
    const lastPos = (logitsTensor.shape[0] - 1) * vocabSize;
    const allLogits = await readBuffer(device, logitsTensor.buffer, logitsTensor.shape[0] * vocabSize * 4);
    const lastLogits = allLogits.slice(lastPos, lastPos + vocabSize);

    const indexed = Array.from(lastLogits).map((v, i) => ({v, i}));
    indexed.sort((a, b) => b.v - a.v);
    print(`\nTop 5 logits:`);
    for (let k = 0; k < 5; k++) {
      print(`  logit=${indexed[k].v.toFixed(2)} id=${indexed[k].i}`);
    }
    print(`Expected top: logit=-78.36 id=16065`);
    print(`EOS (50256): ${lastLogits[50256]?.toFixed(2)}`);
  }

  print("\n=== DONE ===");
  await postResults();
}

run().catch(async e => { print("ERROR: " + e.message + "\n" + e.stack); await postResults(); });
</script>
</body>
</html>
