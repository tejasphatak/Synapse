<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="/ui/assets/icon.svg">
  <link rel="apple-touch-icon" href="/ui/assets/icon-192.png">
  <link rel="manifest" href="/node/manifest.json">
  <title>Synapse — Talk to the Network</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0f;
      --bg-alt: #12121a;
      --bg-panel: #0d0d14;
      --border: #1a1a2a;
      --text: #e0e0e0;
      --text-dim: #888;
      --text-faint: #555;
      --text-mute: #444;
      --accent: #7c5cff;
      --accent-2: #00ff88;
      --danger: #ff4444;
      --warn: #ffaa00;
    }
    html, body { height: 100%; }
    body {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    /* Safe-area padding for notched phones and foldables */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* ── Header strip: logo, title, status, log toggle, contribute toggle */
    .appbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .appbar .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }
    .appbar .brand img {
      width: 28px; height: 28px; flex: 0 0 auto;
    }
    .appbar .brand .name {
      font-weight: 700;
      font-size: 0.95rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .appbar .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      flex: 1 1 auto;
      min-width: 0;
    }
    .appbar .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--danger);
      flex: 0 0 auto;
    }
    .appbar .dot.ready { background: var(--accent-2); }
    .appbar .dot.partial { background: var(--warn); }
    .appbar .status-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .appbar .actions {
      display: flex; align-items: center; gap: 0.25rem;
      flex: 0 0 auto;
    }
    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--text); }
    .btn-icon.on { border-color: var(--accent-2); color: var(--accent-2); }

    /* ── Main chat area: scrolling message list + info banner */
    .main {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 0;
      position: relative;
    }
    .messages {
      overflow-y: auto;
      padding: 1rem clamp(0.75rem, 4vw, 2rem);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .message { line-height: 1.55; }
    .message .role {
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .message .role.user { color: var(--accent); }
    .message .role.assistant { color: var(--accent-2); }
    .message .content {
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: clamp(0.85rem, 1.5vw, 0.95rem);
    }
    .message .meta { font-size: 0.65rem; color: var(--text-mute); margin-top: 0.25rem; }
    .typing-indicator {
      color: var(--text-faint);
      font-style: italic;
      font-size: 0.8rem;
      display: none;
    }
    .typing-indicator.active { display: block; }

    /* ── Input bar: sticky bottom on mobile, centered on desktop */
    .composer {
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 0.75rem clamp(0.5rem, 3vw, 1.5rem);
    }
    .composer-inner {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }
    .composer textarea {
      flex: 1;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      padding: 0.75rem 1rem;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 140px;
      line-height: 1.4;
    }
    .composer textarea:focus { border-color: var(--accent); }
    .composer textarea::placeholder { color: var(--text-faint); }
    .composer button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 1.2rem;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      flex: 0 0 auto;
    }
    .composer button:hover { background: #6a4de6; }
    .composer button:disabled { background: #2a2a3a; color: var(--text-faint); cursor: not-allowed; }

    /* ── Log drawer: slides in from the right. Circular buffer. */
    .log-drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(380px, 90vw);
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.2s ease-out;
      display: flex;
      flex-direction: column;
      z-index: 20;
    }
    .log-drawer.open { transform: translateX(0); }
    .log-drawer .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .log-drawer .log-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      font-size: 0.7rem;
      font-family: 'SF Mono', ui-monospace, monospace;
      color: var(--text-dim);
      line-height: 1.45;
    }
    .log-entry { padding: 0.25rem 0.4rem; border-bottom: 1px solid var(--border); word-break: break-word; }
    .log-entry.error { color: var(--danger); }
    .log-entry.warn { color: var(--warn); }
    .log-entry.ok { color: var(--accent-2); }

    /* ── Responsive tweaks — phone, foldable, tablet, desktop */
    @media (max-width: 520px) {
      .appbar { flex-wrap: wrap; gap: 0.5rem; }
      .appbar .status { order: 3; flex: 1 1 100%; }
      .btn-icon { padding: 0.25rem 0.5rem; font-size: 0.7rem; }
    }
    @media (min-width: 900px) {
      .appbar { padding: 0.75rem 1.25rem; }
      .appbar .brand .name { font-size: 1.1rem; }
    }
    /* Horizontal foldable / ultra-wide — add comfortable side margins */
    @media (min-width: 1200px) {
      .messages, .composer-inner { max-width: 900px; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <img src="/ui/assets/icon.svg" alt="Synapse" onerror="this.src='/ui/assets/icon-192.png'">
      <span class="name">SYNAPSE</span>
    </div>
    <div class="status" id="pipelineStatus">
      <span class="dot" id="pipelineDot"></span>
      <span class="status-text" id="pipelineText">Connecting…</span>
      <span class="status-text" id="fleetSummary"></span>
    </div>
    <div class="actions">
      <button class="btn-icon" id="contribBtn" title="Contribute this device's GPU">Contribute</button>
      <button class="btn-icon" id="logBtn" title="Show event log">Log</button>
    </div>
  </header>

  <div class="main">
    <div class="messages" id="messages">
      <div class="message">
        <div class="role assistant">nex</div>
        <div class="content">Waiting for the neural network to come online. Tap <strong>Contribute</strong> to add this device, or open more browser tabs to grow the fleet.</div>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="composer-inner">
      <textarea id="promptInput" placeholder="Type a message…" rows="1" disabled></textarea>
      <button id="sendBtn" disabled>Send</button>
    </div>
    <div class="typing-indicator" id="typingIndicator" style="text-align:center;margin-top:0.3rem">
      Thinking across the network…
    </div>
    <!-- Legacy hidden stat elements kept so existing JS can write to them without error -->
    <div style="display:none">
      <span id="statNodes">0</span>
      <span id="statGpus">—</span>
      <span id="statPipeline">offline</span>
      <span id="statTokens">0</span>
      <span id="statLatency">—</span>
      <span id="nodeList"></span>
    </div>
  </div>

  <!-- Log drawer: slides in from right. Shows last N events from a circular buffer. -->
  <aside class="log-drawer" id="logDrawer" aria-hidden="true">
    <div class="log-header">
      <span>Event log</span>
      <button class="btn-icon" id="logCloseBtn">Close</button>
    </div>
    <div class="log-body" id="logBody"></div>
  </aside>

  <script>
    // ── Log drawer: circular buffer of recent events, shown on demand.
    const LOG_CAPACITY = 200;
    const logRing = [];
    const logBody = document.getElementById("logBody");
    function appendLog(level, text) {
      if (logRing.length >= LOG_CAPACITY) logRing.shift();
      const ts = new Date().toLocaleTimeString();
      const row = { ts, level, text };
      logRing.push(row);
      // Render incrementally
      const el = document.createElement("div");
      el.className = `log-entry ${level}`;
      el.textContent = `${ts} · ${text}`;
      logBody.appendChild(el);
      while (logBody.children.length > LOG_CAPACITY) logBody.removeChild(logBody.firstChild);
      logBody.scrollTop = logBody.scrollHeight;
    }
    // Expose to other scripts
    window.__synapseLog = appendLog;

    const drawer = document.getElementById("logDrawer");
    const logBtn = document.getElementById("logBtn");
    const logCloseBtn = document.getElementById("logCloseBtn");
    logBtn.addEventListener("click", () => {
      drawer.classList.toggle("open");
      drawer.setAttribute("aria-hidden", drawer.classList.contains("open") ? "false" : "true");
    });
    logCloseBtn.addEventListener("click", () => drawer.classList.remove("open"));

    // ── Contribute toggle: opens an invisible iframe loading /node/index.html.
    // The browser participates as a compute node without leaving the page.
    // This keeps the integration surgical — zero changes needed inside the node code.
    const contribBtn = document.getElementById("contribBtn");
    let contribFrame = null;
    contribBtn.addEventListener("click", () => {
      if (contribFrame) {
        contribFrame.remove();
        contribFrame = null;
        contribBtn.classList.remove("on");
        contribBtn.textContent = "Contribute";
        appendLog("info", "Contribute: off");
      } else {
        contribFrame = document.createElement("iframe");
        contribFrame.src = "/node/index.html";
        contribFrame.style.cssText = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0";
        contribFrame.setAttribute("aria-hidden", "true");
        document.body.appendChild(contribFrame);
        contribBtn.classList.add("on");
        contribBtn.textContent = "Contributing";
        appendLog("ok", "Contribute: device joining the pool");
      }
    });
  </script>

  <script type="module">
    // ─── GPT-2 tokenizer via coordinator API ───
    let tokenizerReady = true;

    const tokenizer = {
      encode: async (text) => {
        const resp = await fetch("/api/tokenize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const { tokenIds } = await resp.json();
        return { input_ids: tokenIds };
      },
      decode: async (ids) => {
        const resp = await fetch("/api/detokenize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tokenIds: Array.isArray(ids) ? ids : [ids] }),
        });
        const { text } = await resp.json();
        return text;
      },
    };

    // ─── WebSocket Connection ─────────────────────────────────────────

    const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${wsProtocol}//${location.host}?type=prompt`;
    let ws = null;
    let pipelineReady = false;
    let totalTokens = 0;
    let latencies = [];

    function connect() {
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        updatePipelineStatus("connected", "Connected — waiting for nodes...");
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        handleMessage(msg);
      };

      ws.onclose = () => {
        updatePipelineStatus("disconnected", "Disconnected — reconnecting...");
        pipelineReady = false;
        updateInputState();
        setTimeout(connect, 3000);
      };
    }

    connect();

    // ─── Message Handling ─────────────────────────────────────────────

    let currentRequestId = null;
    let currentOutput = [];
    let inferenceStartTime = null;
    let lastTokenTime = null;

    function handleMessage(msg) {
      switch (msg.type) {
        case "TOPOLOGY_UPDATE":
          handleTopologyUpdate(msg);
          break;

        case "PIPELINE_READY":
          pipelineReady = true;
          updatePipelineStatus("ready", "Pipeline ready");
          updateInputState();
          addMessage("assistant", "The neural network is online. I'm running across distributed browser nodes. Ask me anything.");
          break;

        case "INFER_STARTED":
          currentRequestId = msg.requestId;
          inferenceStartTime = Date.now();
          lastTokenTime = Date.now();
          break;

        case "INFER_ERROR":
          hideTyping();
          addMessage("assistant", `Error: ${msg.error}`);
          currentRequestId = null;
          updateInputState();
          break;

        case "TOKEN_GENERATED":
          handleStreamToken(msg);
          break;

        case "GENERATION_DONE":
          handleGenerationDone(msg);
          break;

        case "OUTPUT":
          handleOutputToken(msg);
          break;
      }
    }

    function handleTopologyUpdate(msg) {
      const { nodes, pipeline } = msg;
      const activeNodes = nodes.filter(n => n.status === "ready");
      const totalNodes = nodes.length;

      // Update node badges
      const nodeList = document.getElementById("nodeList");
      nodeList.innerHTML = nodes.map(n => {
        const isActive = n.status === "ready";
        return `<span class="node-badge ${isActive ? 'active' : ''}">${n.shardId !== null ? `L${n.layerStart}-${n.layerEnd}` : '...'}</span>`;
      }).join(" ");

      document.getElementById("statNodes").textContent = totalNodes;

      // GPU vendor breakdown (e.g. "2 Qualcomm, 1 Nvidia, 1 Intel")
      const vendorCounts = {};
      let mobileCount = 0;
      let desktopCount = 0;
      for (const n of nodes) {
        const v = n.capabilities?.gpuVendor || "unknown";
        vendorCounts[v] = (vendorCounts[v] || 0) + 1;
        if (n.capabilities?.mobile) mobileCount++; else desktopCount++;
      }
      const vendorStr = Object.entries(vendorCounts)
        .map(([v, c]) => `${c} ${v}`)
        .join(", ") || "—";
      const formFactor = totalNodes ? ` (${mobileCount}mob/${desktopCount}desk)` : "";
      document.getElementById("statGpus").textContent = vendorStr + formFactor;
      // Fleet summary in the app-bar status strip: concise count + breakdown.
      const fs = document.getElementById("fleetSummary");
      if (fs) {
        fs.textContent = totalNodes
          ? `· ${totalNodes} ${totalNodes === 1 ? "GPU" : "GPUs"} — ${vendorStr}${formFactor}`
          : "";
      }

      if (pipeline.length >= 2 && activeNodes.length >= 2) {
        updatePipelineStatus("ready", `Pipeline ready (${activeNodes.length} nodes)`);
        document.getElementById("statPipeline").textContent = "online";
        pipelineReady = true;
      } else if (totalNodes > 0) {
        updatePipelineStatus("partial", `${activeNodes.length}/${totalNodes} nodes ready`);
        document.getElementById("statPipeline").textContent = "partial";
      }

      updateInputState();
    }

    async function handleOutputToken(msg) {
      hideTyping();
      const latency = Date.now() - (inferenceStartTime || Date.now());
      latencies.push(latency);
      totalTokens += msg.tokens.length;

      // Decode token(s) via coordinator API
      let text;
      try {
        text = await tokenizer.decode(msg.tokens);
      } catch {
        text = `[token:${msg.tokens}]`;
      }

      // Append to current assistant message or create new one
      appendToLastAssistant(text, latency);

      document.getElementById("statTokens").textContent = totalTokens;
      const avgLatency = Math.round(latencies.reduce((a, b) => a + b, 0) / latencies.length);
      document.getElementById("statLatency").textContent = `${avgLatency}ms`;

      updateInputState();
      currentRequestId = null;
    }

    async function handleStreamToken(msg) {
      hideTyping();
      const now = Date.now();
      const tokenLatency = now - (lastTokenTime || inferenceStartTime);
      lastTokenTime = now;

      totalTokens++;

      // Decode the single token via coordinator API
      let text;
      try {
        text = await tokenizer.decode([msg.token]);
      } catch {
        text = `[${msg.token}]`;
      }

      appendToLastAssistant(text, `${msg.totalGenerated}/${msg.maxTokens} tokens | ${tokenLatency}ms/tok`);

      document.getElementById("statTokens").textContent = totalTokens;
      document.getElementById("typingIndicator").textContent =
        `Generating token ${msg.totalGenerated}/${msg.maxTokens}...`;
      document.getElementById("typingIndicator").classList.add("active");
    }

    function handleGenerationDone(msg) {
      hideTyping();
      currentRequestId = null;

      const meta = `${msg.totalTokens} tokens in ${(msg.elapsedMs / 1000).toFixed(1)}s (${msg.tokensPerSecond} tok/s)`;
      if (currentAssistantDiv) {
        const metaEl = currentAssistantDiv.querySelector(".meta");
        if (metaEl) metaEl.textContent = meta;
        else {
          const m = document.createElement("div");
          m.className = "meta";
          m.textContent = meta;
          currentAssistantDiv.appendChild(m);
        }
      }

      latencies.push(msg.elapsedMs);
      const avgLatency = Math.round(latencies.reduce((a, b) => a + b, 0) / latencies.length);
      document.getElementById("statLatency").textContent = `${avgLatency}ms`;

      updateInputState();
    }

    // ─── UI Helpers ───────────────────────────────────────────────────

    function addMessage(role, content, meta = "") {
      const messagesDiv = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "message";
      div.innerHTML = `
        <div class="role ${role}">${role === "user" ? "you" : "nex"}</div>
        <div class="content">${content}</div>
        ${meta ? `<div class="meta">${meta}</div>` : ""}
      `;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return div;
    }

    let currentAssistantDiv = null;

    function appendToLastAssistant(text, latency) {
      if (!currentAssistantDiv) {
        currentAssistantDiv = addMessage("assistant", text, `${latency}ms`);
      } else {
        const contentEl = currentAssistantDiv.querySelector(".content");
        contentEl.textContent += text;
        const metaEl = currentAssistantDiv.querySelector(".meta");
        if (metaEl) metaEl.textContent = `${latency}ms per token`;
      }
      const messagesDiv = document.getElementById("messages");
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTyping() {
      document.getElementById("typingIndicator").classList.add("active");
    }

    function hideTyping() {
      document.getElementById("typingIndicator").classList.remove("active");
    }

    function updatePipelineStatus(state, text) {
      const dot = document.getElementById("pipelineDot");
      dot.className = `dot ${state}`;
      document.getElementById("pipelineText").textContent = text;
    }

    function updateInputState() {
      const input = document.getElementById("promptInput");
      const btn = document.getElementById("sendBtn");
      const ready = pipelineReady && ws?.readyState === WebSocket.OPEN && !currentRequestId;
      input.disabled = !ready;
      btn.disabled = !ready;
      if (ready) {
        input.placeholder = "Type a message...";
        input.focus();
      } else if (currentRequestId) {
        input.placeholder = "Generating...";
      } else {
        input.placeholder = "Waiting for network...";
      }
    }

    // ─── Send Logic ───────────────────────────────────────────────────

    async function sendPrompt() {
      const input = document.getElementById("promptInput");
      const text = input.value.trim();
      if (!text || !pipelineReady) return;

      addMessage("user", text);
      input.value = "";
      currentAssistantDiv = null;
      showTyping();

      // Tokenize via coordinator API
      let tokenIds;
      try {
        const result = await tokenizer.encode(text);
        tokenIds = Array.from(result.input_ids || result);
      } catch (e) {
        console.error("[prompt] Tokenize failed:", e);
        return;
      }

      // Send to coordinator
      ws.send(JSON.stringify({
        type: "PROMPT_INFER",
        tokenIds,
        maxTokens: 30,
      }));

      updateInputState();
    }

    // ─── Event Listeners ──────────────────────────────────────────────

    document.getElementById("sendBtn").addEventListener("click", sendPrompt);
    document.getElementById("promptInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendPrompt();
      }
    });
  </script>
</body>
</html>
