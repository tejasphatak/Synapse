<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webmind — Distributed Knowledge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f0faf0;
      --surface: #ffffff;
      --primary: #2d8a4e;
      --primary-light: #e8f5e9;
      --primary-dark: #1b5e20;
      --text: #1a1a1a;
      --text-secondary: #666;
      --border: #c8e6c9;
      --user-bg: #2d8a4e;
      --user-text: #fff;
      --bot-bg: #f1f8e9;
      --bot-text: #1a1a1a;
      --shadow: 0 2px 12px rgba(45,138,78,0.08);
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      z-index: 10;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
    }
    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .logo-sub {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 400;
    }
    .stats-badge {
      background: var(--primary-light);
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Chat area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .message.user { align-self: flex-end; }
    .message.bot { align-self: flex-start; }

    .message-bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }
    .message.user .message-bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }
    .message.bot .message-bubble {
      background: var(--bot-bg);
      color: var(--bot-text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      padding: 0 4px;
    }
    .message.user .message-meta { text-align: right; }

    /* Facts */
    .fact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.4;
    }
    .fact-source {
      color: var(--primary);
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }
    .fact-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 8px;
      margin-bottom: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Input */
    .input-container {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
    }
    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .input-wrapper input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      background: var(--bg);
    }
    .input-wrapper input:focus {
      border-color: var(--primary);
    }
    .input-wrapper button {
      padding: 14px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .input-wrapper button:hover { background: var(--primary-dark); }
    .input-wrapper button:disabled { background: #aaa; cursor: not-allowed; }

    /* Welcome */
    .welcome {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    .welcome h2 {
      color: var(--primary-dark);
      font-size: 24px;
      margin-bottom: 8px;
    }
    .welcome p { font-size: 14px; max-width: 400px; margin: 0 auto; }

    /* Loading */
    .loading-dots::after {
      content: '';
      animation: dots 1.5s infinite;
    }
    @keyframes dots {
      0% { content: '.'; }
      33% { content: '..'; }
      66% { content: '...'; }
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--primary); text-decoration: none; }

    /* Mobile */
    @media (max-width: 600px) {
      .message { max-width: 92%; }
      header { padding: 10px 14px; }
      .chat-container { padding: 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">W</div>
    <div>
      <div class="logo-text">Webmind</div>
      <div class="logo-sub">Distributed Knowledge Engine</div>
    </div>
  </div>
  <div class="stats-badge" id="stats">Loading...</div>
</header>

<div class="chat-container" id="chat">
  <div class="welcome">
    <h2>Ask anything</h2>
    <p>Powered by SAQT — distributed knowledge retrieval across 65,000+ facts. No GPU required. Zero hallucinations.</p>
  </div>
</div>

<div class="input-container">
  <div class="input-wrapper">
    <input type="text" id="input" placeholder="Ask a question..." autocomplete="off" autofocus>
    <button id="send" onclick="sendQuery()">Ask</button>
  </div>
</div>

<footer>
  Open source &middot; <a href="https://github.com/tejasphatak/webmind-research" target="_blank">GitHub</a>
  &middot; No data collected &middot; Runs on your device
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const history = []; // conversation memory

input.addEventListener('keydown', e => { if (e.key === 'Enter' && !sendBtn.disabled) sendQuery(); });

// Load stats
fetch('/api/saqt/stats').then(r => r.json()).then(s => {
  document.getElementById('stats').textContent =
    `${s.chunks.toLocaleString()} facts · ${s.topics} topics`;
}).catch(() => {
  document.getElementById('stats').textContent = 'Offline';
});

function addMessage(role, content, meta) {
  // Remove welcome
  const welcome = chat.querySelector('.welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `message ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.innerHTML = content;
  div.appendChild(bubble);

  if (meta) {
    const metaDiv = document.createElement('div');
    metaDiv.className = 'message-meta';
    metaDiv.textContent = meta;
    div.appendChild(metaDiv);
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

async function sendQuery() {
  const q = input.value.trim();
  if (!q) return;

  addMessage('user', escapeHtml(q));
  input.value = '';
  sendBtn.disabled = true;

  const loadingBubble = addMessage('bot', '<span class="loading-dots">Searching</span>');

  try {
    const res = await fetch('/api/saqt/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, hops: 5, context: history.slice(-6).map(h => `${h.q} ${h.a}`).join(' ') })
    });
    const data = await res.json();

    // Build answer — ONE clean response
    let html = '';

    if (data.answer) {
      html += `<div style="line-height:1.7;">${escapeHtml(data.answer)}</div>`;
    } else {
      html += `<div style="color:var(--text-secondary);">I don't have enough information to answer that yet.</div>`;
    }

    // Sources hidden by default — click to expand
    if (data.facts && data.facts.length > 0) {
      html += `<details style="margin-top:10px;"><summary style="cursor:pointer;font-size:11px;color:var(--text-secondary);user-select:none;">${data.totalFacts} sources · ${data.hops} hops · ${data.timeMs}ms</summary>`;
      for (const fact of data.facts.slice(0, 4)) {
        html += `<div class="fact-card">${escapeHtml(fact.substring(0, 200))}</div>`;
      }
      html += `</details>`;
    }

    loadingBubble.innerHTML = html;

    const meta = `${data.hops} hops · ${data.totalFacts} facts · ${data.timeMs}ms`;
    const metaDiv = loadingBubble.parentElement.querySelector('.message-meta');
    if (metaDiv) metaDiv.textContent = meta;
    else {
      const m = document.createElement('div');
      m.className = 'message-meta';
      m.textContent = meta;
      loadingBubble.parentElement.appendChild(m);
    }

    // Save to history for conversation continuity
    history.push({ q, a: data.answer || '' });

  } catch (e) {
    loadingBubble.innerHTML = `Error: ${e.message}`;
  }

  sendBtn.disabled = false;
  input.focus();
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

</body>
</html>
