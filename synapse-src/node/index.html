<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/node/manifest.json">
  <meta name="theme-color" content="#0a0a0f">
  <title>Synapse — Compute Node</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    body {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      color: #7c5cff;
      margin-bottom: 0.5rem;
    }
    .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 2rem; }

    .status-card {
      background: #12121a;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 600px;
      margin-bottom: 1.5rem;
    }
    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    .status-indicator.ready { background: #00ff88; }
    .status-indicator.loading { background: #ffaa00; }
    .status-indicator.error { background: #ff4444; }
    .status-indicator.computing { background: #00aaff; animation: pulse 0.5s infinite; }
    .status-indicator.disconnected { background: #444; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #1a1a2a;
    }
    .info-label { color: #888; }
    .info-value { color: #ccc; font-weight: 600; }
    .info-value.highlight { color: #7c5cff; }

    .log-panel {
      background: #0d0d14;
      border: 1px solid #1a1a2a;
      border-radius: 8px;
      padding: 1rem;
      width: 100%;
      max-width: 600px;
      max-height: 300px;
      overflow-y: auto;
      font-size: 0.8rem;
      line-height: 1.6;
    }
    .log-entry { color: #555; }
    .log-entry.info { color: #888; }
    .log-entry.success { color: #00ff88; }
    .log-entry.warn { color: #ffaa00; }
    .log-entry.error { color: #ff4444; }
    .log-entry .timestamp { color: #444; margin-right: 8px; }

    #fullscreenBtn {
      background: #7c5cff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.4rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 1.5rem;
      display: none;
    }
    #fullscreenBtn:active { opacity: 0.8; }
  </style>
</head>
<body>
  <h1>SYNAPSE</h1>
  <p class="subtitle">Distributed Neural Compute Node</p>
  <button id="fullscreenBtn">Go Fullscreen</button>

  <div class="status-card">
    <div style="display: flex; align-items: center; margin-bottom: 1.5rem;">
      <span id="statusDot" class="status-indicator loading"></span>
      <span id="statusText" style="font-size: 1.1rem;">Initializing...</span>
    </div>

    <div class="info-row">
      <span class="info-label">Node ID</span>
      <span class="info-value" id="nodeId">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Shard</span>
      <span class="info-value highlight" id="shardInfo">Waiting for assignment...</span>
    </div>
    <div class="info-row">
      <span class="info-label">Layers</span>
      <span class="info-value highlight" id="layerInfo">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Pipeline Position</span>
      <span class="info-value" id="pipelinePos">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Tensors Loaded</span>
      <span class="info-value" id="tensorCount">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">WebGPU</span>
      <span class="info-value" id="webgpuStatus">Checking...</span>
    </div>
    <div class="info-row">
      <span class="info-label">GPU</span>
      <span class="info-value" id="gpuVendor">—</span>
    </div>
    <div class="info-row" style="border-bottom: none;">
      <span class="info-label">Device</span>
      <span class="info-value" id="deviceType">—</span>
    </div>
  </div>

  <!-- Chat Panel (collapsible) -->
  <div id="chatSection" style="display:none; margin: 8px; background: #0d0d14; border: 1px solid #1a1a2a; border-radius: 12px; overflow: hidden;">
    <div id="chatToggle" style="padding: 10px 16px; background: #12121a; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
      <span style="color: #7c5cff; font-weight: bold; font-size: 14px;">Chat</span>
      <span id="chatStatus" style="font-size: 11px; color: #555;">waiting for pipeline</span>
    </div>
    <div id="chatBody" style="display:none;">
      <div id="chatMessages" style="max-height: 200px; overflow-y: auto; padding: 10px; font-size: 13px;"></div>
      <div style="display: flex; gap: 6px; padding: 8px;">
        <input id="chatInput" type="text" placeholder="Waiting for pipeline..." disabled
          style="flex:1; background:#12121a; border:1px solid #333; border-radius:6px; color:#e0e0e0; padding:8px 12px; font-family:inherit; font-size:13px; outline:none;">
        <button id="chatSend" disabled
          style="background:#7c5cff; color:white; border:none; border-radius:6px; padding:8px 16px; font-family:inherit; cursor:pointer;">Send</button>
      </div>
    </div>
  </div>

  <div class="log-panel" id="logPanel"></div>

  <script type="module">
    import { SynapseNode } from "./node.js?v=20260413b";

    // Remote console — streams errors back to coordinator
    const _origConsole = { log: console.log, error: console.error, warn: console.warn };
    function remoteLog(level, ...args) {
      const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
      fetch('/api/diag', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ level, msg, ts: Date.now(), ua: navigator.userAgent.slice(0,100) })
      }).catch(() => {});
    }
    console.log = (...a) => { _origConsole.log(...a); remoteLog('log', ...a); };
    console.error = (...a) => { _origConsole.error(...a); remoteLog('error', ...a); };
    console.warn = (...a) => { _origConsole.warn(...a); remoteLog('warn', ...a); };
    window.onerror = (msg, src, line) => remoteLog('error', `${msg} at ${src}:${line}`);

    const logPanel = document.getElementById("logPanel");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");

    function log(message, level = "info") {
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement("div");
      entry.className = `log-entry ${level}`;
      entry.innerHTML = `<span class="timestamp">${time}</span>${message}`;
      logPanel.appendChild(entry);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    function updateStatus(status, detail, node) {
      const statusMap = {
        initializing: { dot: "loading", text: "Initializing..." },
        checking_webgpu: { dot: "loading", text: "Checking WebGPU..." },
        connecting: { dot: "loading", text: "Connecting to coordinator..." },
        connected: { dot: "loading", text: "Connected — waiting for shard assignment" },
        loading_shard: { dot: "loading", text: `Loading shard: ${detail}` },
        ready: { dot: "ready", text: `Ready ${detail ? "— " + detail : ""}` },
        computing: { dot: "computing", text: `Computing: ${detail}` },
        disconnected: { dot: "disconnected", text: "Disconnected" },
        reconnecting: { dot: "loading", text: "Reconnecting..." },
        error: { dot: "error", text: `Error: ${detail}` },
      };

      const s = statusMap[status] || { dot: "loading", text: status };
      statusDot.className = `status-indicator ${s.dot}`;
      statusText.textContent = s.text;

      if (node) {
        document.getElementById("nodeId").textContent = node.nodeId;
        if (node.shardId !== null) {
          document.getElementById("shardInfo").textContent = `Shard ${node.shardId}`;
          document.getElementById("layerInfo").textContent = `${node.layerStart} — ${node.layerEnd}`;
        }
        if (node.isFirstNode) {
          document.getElementById("pipelinePos").textContent = "First (input)";
        } else if (node.isLastNode) {
          document.getElementById("pipelinePos").textContent = "Last (output)";
        } else if (node.topology?.pipeline?.length) {
          const idx = node.topology.pipeline.indexOf(node.nodeId);
          document.getElementById("pipelinePos").textContent = `${idx + 1} of ${node.topology.pipeline.length}`;
        }
      }

      log(`[${status}] ${detail || ""}`, status === "error" ? "error" : status === "ready" ? "success" : "info");
    }

    // Start the node
    const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${wsProtocol}//${location.host}`;

    const node = new SynapseNode(updateStatus);
    document.getElementById("nodeId").textContent = node.nodeId;

    // Check WebGPU and device info
    if (navigator.gpu) {
      document.getElementById("webgpuStatus").textContent = "Available";
      document.getElementById("webgpuStatus").style.color = "#00ff88";

      // Detect GPU details
      navigator.gpu.requestAdapter().then(adapter => {
        if (adapter) {
          const vendor = adapter.info?.vendor || "unknown";
          const maxBuf = Math.round(adapter.limits.maxBufferSize / 1024 / 1024);
          document.getElementById("gpuVendor").textContent = `${vendor} (max ${maxBuf}MB buffer)`;
        }
      });
    } else {
      document.getElementById("webgpuStatus").textContent = "Not Available";
      document.getElementById("webgpuStatus").style.color = "#ff4444";
    }

    // Device type
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    document.getElementById("deviceType").textContent = isMobile ? "Mobile" : "Desktop";
    document.getElementById("deviceType").style.color = isMobile ? "#ffaa00" : "#00ff88";

    log("Starting Synapse compute node...", "info");
    node.start(wsUrl).then((connected) => {
      if (connected) {
        log("Connected to coordinator", "success");
      } else {
        log("Failed to connect", "error");
      }
    });

    // Expose node globally for debugging
    window.synapseNode = node;

    // ─── Mobile protections ───────────��───────────────────
    // Prevent accidental refresh/navigation once shard is loading
    window.addEventListener("beforeunload", (e) => {
      if (node.status === "loading_shard" || node.status === "ready" || node.status === "computing") {
        e.preventDefault();
      }
    });

    // Auto-hide address bar on iOS Safari
    if (/iPhone|iPad/.test(navigator.userAgent)) {
      setTimeout(() => window.scrollTo(0, 1), 100);
    }

    // Fullscreen button (hides browser chrome, prevents swipe-to-refresh)
    const fsBtn = document.getElementById("fullscreenBtn");
    if (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) {
      fsBtn.style.display = "block";
      fsBtn.addEventListener("click", () => {
        const el = document.documentElement;
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(() => {});
        fsBtn.style.display = "none";
      });
      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) fsBtn.style.display = "block";
      });
    }

    // ─── Keep-alive: wake lock + visibility resume ──────────
    // Aggressive wake lock — keeps screen on while node is active
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            log("Wake lock released — screen may turn off", "warn");
            // Re-acquire on next visibility change
          });
          log("Screen wake lock acquired — screen will stay on", "success");
        }
      } catch (e) {
        log("Wake lock unavailable: " + e.message, "warn");
      }
    }
    requestWakeLock();

    // Re-acquire wake lock and reconnect when app comes back to foreground
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible") {
        log("App resumed — checking connection...", "info");
        requestWakeLock();
        // If WebSocket is dead, reconnect
        if (!node.ws || node.ws.readyState !== 1) {
          log("Reconnecting to coordinator...", "info");
          node.start(wsUrl).then(ok => {
            if (ok) log("Reconnected!", "success");
            else log("Reconnect failed", "error");
          });
        }
      }
    });

    // No hacky keep-alive tricks — just proper wake lock API
    // If the device doesn't support it, we inform the user honestly

    // Register service worker for PWA install
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/node/sw.js').catch(() => {});
    }

    // ─── Integrated Chat (prompt client) ────────────────────
    const chatSection = document.getElementById("chatSection");
    const chatBody = document.getElementById("chatBody");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const chatSend = document.getElementById("chatSend");
    const chatStatus = document.getElementById("chatStatus");
    let promptWs = null;
    let chatReady = false;
    let chatCurrentDiv = null;

    // Show chat section once node is connected
    function showChat() {
      chatSection.style.display = "block";
    }

    // Toggle chat body
    document.getElementById("chatToggle").addEventListener("click", () => {
      chatBody.style.display = chatBody.style.display === "none" ? "block" : "none";
    });

    // Connect prompt WebSocket
    function connectPrompt() {
      const promptUrl = `${wsProtocol}//${location.host}?type=prompt`;
      promptWs = new WebSocket(promptUrl);

      promptWs.onopen = () => {
        chatStatus.textContent = "connected";
        chatStatus.style.color = "#00ff88";
      };

      promptWs.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "TOPOLOGY_UPDATE") {
          const ready = msg.pipeline?.length >= 2 && msg.nodes?.every(n => n.status === "ready");
          if (ready && !chatReady) {
            chatReady = true;
            chatInput.disabled = false;
            chatSend.disabled = false;
            chatInput.placeholder = "Type a message...";
            chatStatus.textContent = "ready";
            addChat("synapse", "Pipeline online. Ask me anything.");
          }
        } else if (msg.type === "INFER_STARTED") {
          chatStatus.textContent = "thinking...";
          chatStatus.style.color = "#ffaa00";
        } else if (msg.type === "TOKEN_GENERATED") {
          appendChat(msg.token);
        } else if (msg.type === "GENERATION_DONE") {
          chatStatus.textContent = "ready";
          chatStatus.style.color = "#00ff88";
          chatCurrentDiv = null;
          chatInput.disabled = false;
          chatSend.disabled = false;
          if (msg.tokensPerSecond) {
            const meta = document.createElement("div");
            meta.style.cssText = "font-size:10px; color:#444; margin-top:2px;";
            meta.textContent = `${msg.totalTokens} tokens, ${msg.tokensPerSecond} tok/s`;
            chatMessages.lastElementChild?.appendChild(meta);
          }
        }
      };

      promptWs.onclose = () => {
        chatStatus.textContent = "disconnected";
        chatStatus.style.color = "#ff4444";
        chatReady = false;
        setTimeout(connectPrompt, 3000);
      };
    }

    function addChat(role, text) {
      const div = document.createElement("div");
      div.style.cssText = `margin-bottom:8px;`;
      div.innerHTML = `<span style="color:${role==='you'?'#7c5cff':'#00ff88'}; font-size:11px; font-weight:bold;">${role}</span><br><span class="chat-text" style="color:#ccc;">${text}</span>`;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return div;
    }

    async function appendChat(tokenId) {
      let text;
      try {
        const resp = await fetch("/api/detokenize", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ tokenIds: [tokenId] })
        });
        text = (await resp.json()).text;
      } catch { text = `[${tokenId}]`; }

      if (!chatCurrentDiv) {
        chatCurrentDiv = addChat("synapse", text);
      } else {
        chatCurrentDiv.querySelector(".chat-text").textContent += text;
      }
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendChat() {
      const text = chatInput.value.trim();
      if (!text || !chatReady) return;
      addChat("you", text);
      chatInput.value = "";
      chatCurrentDiv = null;
      chatInput.disabled = true;
      chatSend.disabled = true;

      try {
        const resp = await fetch("/api/tokenize", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ text })
        });
        const { tokenIds } = await resp.json();
        promptWs.send(JSON.stringify({ type: "PROMPT_INFER", tokenIds, maxTokens: 30 }));
      } catch (e) {
        addChat("synapse", "Error: " + e.message);
        chatInput.disabled = false;
        chatSend.disabled = false;
      }
    }

    chatSend.addEventListener("click", sendChat);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); sendChat(); }
    });

    // Start prompt connection when node connects
    const origOnStatus = node.onStatus;
    node.onStatus = (status, detail, n) => {
      origOnStatus?.(status, detail, n);
      if (status === "ready" || status === "connected") {
        showChat();
        if (!promptWs) connectPrompt();
      }
    };
  </script>
</body>
</html>
